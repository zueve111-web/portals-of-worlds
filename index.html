
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Порталы миров</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#142c3d;color:white;font-family:Arial;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#top{position:fixed;top:12px;left:0;width:100%;text-align:center;text-shadow:0 2px 5px #000;pointer-events:none}
#top b{font-size:23px}
#world{margin-top:5px}
#controls{position:fixed;bottom:18px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}
#pad{width:130px;height:130px;border:2px solid #ffffff88;background:#ffffff22;border-radius:50%;position:relative;touch-action:none}
#stick{position:absolute;width:52px;height:52px;left:37px;top:37px;background:#d6f5ffdd;border-radius:50%;border:2px solid white}
button{width:68px;height:68px;border-radius:50%;border:2px solid #82edff;background:#124d70;color:white;font-weight:bold;font-size:11px;touch-action:manipulation}
#buttons{display:flex;gap:9px;align-items:end}
#jump{width:76px;height:76px;background:#087cb9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><b>ПОРТАЛЫ МИРОВ</b><div id="world">Земля • Мир 1 из 5</div></div>
<div id="controls">
<div id="pad"><div id="stick"></div></div>
<div id="buttons"><button id="next">СМЕНИТЬ<br>МИР</button><button id="jump">ПРЫЖОК</button></div>
</div>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resize(){
W=innerWidth;H=innerHeight;
canvas.width=Math.round(W*(devicePixelRatio||1));
canvas.height=Math.round(H*(devicePixelRatio||1));
ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
}
addEventListener('resize',resize);resize();

const worlds=[
['Земля','#69c9ff','#317c3d','#22743b','#35ffff'],
['Ледяная планета','#9ce9ff','#bcecf4','#e9ffff','#52faff'],
['Джунгли','#174b36','#22582b','#267c37','#83ff65'],
['Вулканическая планета','#351823','#30252a','#852c1b','#ff5425'],
['Пустыня','#f5bd79','#cba15d','#a27c42','#ffe26c']
];
let wi=0,px=0,pz=0,dir=0,dx=0,dy=0,alt=0,up=0;
let objects=[];
function randomWorld(){
objects=[];
let seed=wi*1009+89;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(let i=0;i<90;i++){
let x=(rnd()-.5)*100,z=-8-rnd()*100;
objects.push({x,z,s:.5+rnd()*1.5,t:rnd()});
}
}
randomWorld();
function changeWorld(){
wi=(wi+1)%worlds.length;px=0;pz=0;randomWorld();
document.getElementById('world').textContent=worlds[wi][0]+' • Мир '+(wi+1)+' из 5';
}
document.getElementById('next').onclick=changeWorld;

function project(x,z){
let a=x-px,b=z-pz;
let r=a*Math.cos(dir)+b*Math.sin(dir);
let d=a*Math.sin(dir)-b*Math.cos(dir)+9;
if(d<.5)return null;
let f=Math.min(W,H)*.85;
return {x:W/2+r*f/d,y:H*.43+3.2*f/d,s:f/d,d};
}
function poly(points,color){
ctx.fillStyle=color;ctx.beginPath();
points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
ctx.closePath();ctx.fill();
}
function render(){
const w=worlds[wi];
let sky=ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,w[1]);sky.addColorStop(.48,w[1]);sky.addColorStop(1,w[2]);
ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

poly([[0,H*.47],[W*.13,H*.33],[W*.24,H*.42],[W*.4,H*.3],[W*.55,H*.43],[W*.75,H*.32],[W,H*.42],[W,H*.63],[0,H*.63]],w[2]);
ctx.fillStyle=w[2];ctx.fillRect(0,H*.49,W,H*.51);

ctx.save();ctx.beginPath();ctx.rect(0,H*.47,W,H*.53);ctx.clip();
for(let i=0;i<14;i++){
let y=H*.47+(i/14)*(i/14)*H*.8;
ctx.strokeStyle='#ffffff20';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
}
objects.slice().sort((a,b)=>b.z-a.z).forEach(o=>{
let p=project(o.x,o.z);if(!p||p.s<1||p.s>150)return;
let s=o.s*p.s;
if(wi===0||wi===2){
ctx.fillStyle='#65452d';ctx.fillRect(p.x-s*.12,p.y-s*.7,s*.24,s*.7);
ctx.fillStyle=o.t>.5?w[3]:'#318444';
poly([[p.x,p.y-s*2],[p.x-s*.75,p.y-s*.2],[p.x+s*.75,p.y-s*.2]],w[3]);
poly([[p.x,p.y-s*1.5],[p.x-s,p.y],[p.x+s,p.y]],w[3]);
}else if(wi===1){
poly([[p.x,p.y-s*2],[p.x-s*.8,p.y],[p.x+s*.8,p.y]],'#e5fbff');
ctx.fillStyle='#b2e5f1';ctx.fillRect(p.x-s*.12,p.y-s*.4,s*.24,s*.4);
}else if(wi===3){
poly([[p.x,p.y-s*1.8],[p.x-s,p.y],[p.x+s,p.y]],'#3c3030');
ctx.fillStyle='#ff5523';ctx.fillRect(p.x-s*.12,p.y-s*.4,s*.24,s*.4);
}else{
ctx.fillStyle='#75512d';ctx.fillRect(p.x-s*.1,p.y-s*.7,s*.2,s*.7);
ctx.fillStyle='#b99757';ctx.fillRect(p.x-s*.65,p.y-s*.75,s*1.3,s*.18);
}
});

let portal=project(0,pz-18);
if(portal){
let r=Math.min(130,portal.s*2.2);
ctx.save();ctx.shadowBlur=25;ctx.shadowColor=w[4];ctx.strokeStyle=w[4];ctx.lineWidth=5;
ctx.beginPath();ctx.ellipse(portal.x,portal.y-r,r*.67,r,0,0,Math.PI*2);ctx.stroke();
ctx.globalAlpha=.25;ctx.fillStyle=w[4];ctx.fill();
ctx.restore();
ctx.fillStyle='white';ctx.font='bold 13px Arial';ctx.textAlign='center';
ctx.fillText('ПОРТАЛ',portal.x,portal.y-r*2.2);
}
ctx.restore();

let y=H*.74-alt;
ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(W/2,H*.75,20,7,0,0,7);ctx.fill();
ctx.fillStyle='#172c4d';ctx.fillRect(W/2-12,y-37,24,28);
ctx.fillStyle='#187cff';ctx.fillRect(W/2-15,y-39,30,22);
ctx.fillStyle='#ffd1a3';ctx.beginPath();ctx.arc(W/2,y-48,11,0,7);ctx.fill();
ctx.fillStyle='#19283c';ctx.fillRect(W/2-10,y-59,20,6);
}
let last=performance.now();
function loop(now){
let dt=Math.min((now-last)/1000,.04);last=now;
if(Math.abs(dx)+Math.abs(dy)>.04){
let fx=-dy,rx=dx;
let vx=Math.sin(dir)*fx+Math.cos(dir)*rx;
let vz=-Math.cos(dir)*fx+Math.sin(dir)*rx;
let n=Math.hypot(vx,vz)||1;
px+=vx/n*8*dt;pz+=vz/n*8*dt;
dir=Math.atan2(-vx/n,vz/n)+Math.PI;
}
if(up){alt+=up*dt*10;up-=20*dt;if(alt<0){alt=0;up=0}}
render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const pad=document.getElementById('pad'),stick=document.getElementById('stick');
let active=false;
function move(e){
let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
let n=Math.hypot(x,y),m=39;if(n>m){x=x/n*m;y=y/n*m}
stick.style.left=(r.width/2-26+x)+'px';stick.style.top=(r.height/2-26+y)+'px';
dx=x/m;dy=y/m;
}
function release(){active=false;dx=dy=0;stick.style.left='37px';stick.style.top='37px'}
pad.addEventListener('pointerdown',e=>{active=true;pad.setPointerCapture(e.pointerId);move(e)});
pad.addEventListener('pointermove',e=>{if(active)move(e)});
pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(alt===0)up=6});
addEventListener('keydown',e=>{
if(e.key==='ArrowUp'||e.key==='w')dy=-1;
if(e.key==='ArrowDown'||e.key==='s')dy=1;
if(e.key==='ArrowLeft'||e.key==='a')dx=-1;
if(e.key==='ArrowRight'||e.key==='d')dx=1;
if(e.code==='Space'&&alt===0)up=6;
if(e.key==='e')changeWorld();
});
addEventListener('keyup',e=>{
if(['ArrowUp','ArrowDown','w','s'].includes(e.key))dy=0;
if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))dx=0;
});
})();
</script>
</body>
</html>
