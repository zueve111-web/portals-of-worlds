
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Порталы миров</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07101b;font-family:Arial;color:white}
canvas{display:block}
#title{position:fixed;top:12px;left:0;width:100%;text-align:center;font-size:22px;font-weight:bold;text-shadow:0 2px 10px #000;pointer-events:none}
#info{position:fixed;top:44px;width:100%;text-align:center;font-size:14px;text-shadow:0 2px 5px #000;pointer-events:none}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{width:145px;height:145px;border-radius:50%;border:2px solid #ffffff66;background:#ffffff18;position:relative;pointer-events:auto;touch-action:none}
#stick{width:58px;height:58px;background:#c5edffbb;border:2px solid white;border-radius:50%;position:absolute;left:41px;top:41px}
.buttons{display:flex;gap:12px;align-items:end;pointer-events:auto}
button{color:white;background:#172d46dd;border:2px solid #8de8ff;border-radius:50%;width:67px;height:67px;font-size:13px;font-weight:bold;touch-action:none}
#jump{width:78px;height:78px;background:#1a8ccdcc}
#hint{position:fixed;bottom:180px;width:100%;text-align:center;font-size:12px;color:#e5f8ff;text-shadow:0 2px 4px black;pointer-events:none}
</style>
</head>
<body>
<div id="title">ПОРТАЛЫ МИРОВ</div>
<div id="info">Земля • Мир 1 из 5</div>
<div id="hint">Исследуй мир и найди светящийся портал</div>
<div id="controls">
<div class="pad" id="pad"><div id="stick"></div></div>
<div class="buttons"><button id="portal">ПОРТАЛ</button><button id="jump">ПРЫЖОК</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ad7ff);
scene.fog=new THREE.Fog(0x8ad7ff,35,100);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc5e8ff,0x354026,2));
const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(12,25,10);sun.castShadow=true;scene.add(sun);
const worlds=[
{name:"Земля",sky:0x8ad7ff,ground:0x428b43,accent:0x00ffff},
{name:"Ледяная планета",sky:0x9bdfff,ground:0xb9e7f5,accent:0x55ffff},
{name:"Джунгли",sky:0x194d39,ground:0x23632d,accent:0x62ff7c},
{name:"Вулканическая планета",sky:0x35191c,ground:0x292326,accent:0xff4a16},
{name:"Пустыня",sky:0xf7bd76,ground:0xd6ad65,accent:0xffd34e}
];
let worldIndex=0,portal;
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),new THREE.MeshStandardMaterial({color:0x2277ff,roughness:.5}));
body.position.y=1;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),new THREE.MeshStandardMaterial({color:0xffd0a0}));
head.position.y=1.75;player.add(head);
const groundMat=new THREE.MeshStandardMaterial({color:0x428b43,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const objects=new THREE.Group();scene.add(objects);
function clearWorld(){while(objects.children.length){const o=objects.children.pop();o.traverse?.(x=>{x.geometry?.dispose();if(x.material){if(Array.isArray(x.material))x.material.forEach(m=>m.dispose());else x.material.dispose()}});objects.remove(o)}}
function makeTree(x,z,s=1){
const g=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,1.6*s,7),new THREE.MeshStandardMaterial({color:worldIndex===1?0x7696a0:0x68432a}));
trunk.position.y=.8*s;trunk.castShadow=true;g.add(trunk);
const colors=[0x267a3a,0x348f42,0x165a36];
for(let i=0;i<3;i++){const mat=new THREE.MeshStandardMaterial({color:worldIndex===1?0xe4faff:worldIndex===3?0x69251e:colors[i]});const cone=new THREE.Mesh(new THREE.ConeGeometry((1.1-i*.2)*s,1.8*s,7),mat);cone.position.y=(1.7+i*.55)*s;cone.castShadow=true;g.add(cone)}
g.position.set(x,0,z);objects.add(g);
}
function buildWorld(){
clearWorld();
const w=worlds[worldIndex];
scene.background.setHex(w.sky);scene.fog.color.setHex(w.sky);groundMat.color.setHex(w.ground);
groundMat.needsUpdate=true;
for(let i=0;i<90;i++){
const x=(Math.random()-.5)*110,z=(Math.random()-.5)*110;
if(Math.hypot(x,z)<7)continue;
if(worldIndex===0||worldIndex===2)makeTree(x,z,.7+Math.random()*.9);
else if(worldIndex===1){
const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*1.2),new THREE.MeshStandardMaterial({color:0xc9efff,metalness:.25,roughness:.3}));
rock.position.set(x,.5,z);rock.castShadow=true;objects.add(rock);
}else if(worldIndex===3){
const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+Math.random()),new THREE.MeshStandardMaterial({color:0x352b2b,roughness:1}));
rock.position.set(x,.6,z);rock.castShadow=true;objects.add(rock);
}else{
const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*1.6),new THREE.MeshStandardMaterial({color:0xc49a56}));
rock.position.set(x,.5,z);objects.add(rock);
}}
const ring=new THREE.Mesh(new THREE.TorusGeometry(2, .18,12,48),new THREE.MeshStandardMaterial({color:w.accent,emissive:w.accent,emissiveIntensity:2,metalness:.3,roughness:.2}));
ring.position.set(0,2.5,-13);ring.castShadow=true;objects.add(ring);portal=ring;
const inner=new THREE.Mesh(new THREE.CircleGeometry(1.8,48),new THREE.MeshBasicMaterial({color:w.accent,transparent:true,opacity:.25,side:THREE.DoubleSide}));
inner.position.set(0,2.5,-13);objects.add(inner);
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3.2,.4,32),new THREE.MeshStandardMaterial({color:0x273448,metalness:.7,roughness:.3}));
base.position.set(0,.2,-13);objects.add(base);
document.getElementById('info').textContent=w.name+" • Мир "+(worldIndex+1)+" из "+worlds.length;
}
buildWorld();
player.position.set(0,0,3);
let moveX=0,moveY=0,vy=0,onGround=true,angle=0;
const pad=document.getElementById('pad'),stick=document.getElementById('stick');
let dragging=false;
function joystick(e){
const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
let x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2;
const max=43,len=Math.hypot(x,y);
if(len>max){x=x/len*max;y=y/len*max}
stick.style.left=(r.width/2-29+x)+'px';stick.style.top=(r.height/2-29+y)+'px';
moveX=x/max;moveY=y/max;
}
pad.addEventListener('pointerdown',e=>{dragging=true;pad.setPointerCapture(e.pointerId);joystick(e)});
pad.addEventListener('pointermove',e=>{if(dragging)joystick(e)});
function stopStick(){dragging=false;moveX=moveY=0;stick.style.left='41px';stick.style.top='41px'}
pad.addEventListener('pointerup',stopStick);pad.addEventListener('pointercancel',stopStick);
function jump(){if(onGround){vy=8;onGround=false}}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('portal').addEventListener('click',()=>{
worldIndex=(worldIndex+1)%worlds.length;buildWorld();player.position.set(0,0,3);
});
window.addEventListener('keydown',e=>{
if(e.key==='ArrowUp'||e.key==='w')moveY=-1;
if(e.key==='ArrowDown'||e.key==='s')moveY=1;
if(e.key==='ArrowLeft'||e.key==='a')moveX=-1;
if(e.key==='ArrowRight'||e.key==='d')moveX=1;
if(e.code==='Space')jump();
if(e.key==='e')document.getElementById('portal').click();
});
window.addEventListener('keyup',e=>{
if(['ArrowUp','ArrowDown','w','s'].includes(e.key))moveY=0;
if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))moveX=0;
});
let last=performance.now();
function animate(now){
requestAnimationFrame(animate);
const dt=Math.min((now-last)/1000,.04);last=now;
const forward=new THREE.Vector3(-Math.sin(angle),0,-Math.cos(angle));
const right=new THREE.Vector3(Math.cos(angle),0,-Math.sin(angle));
const direction=forward.clone().multiplyScalar(-moveY).add(right.multiplyScalar(moveX));
if(direction.lengthSq()>0){direction.normalize();player.position.addScaledVector(direction,7*dt);angle=Math.atan2(-direction.x,-direction.z);player.rotation.y=angle}
vy-=20*dt;player.position.y+=vy*dt;
if(player.position.y<0){player.position.y=0;vy=0;onGround=true}
player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);
player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90);
const target=new THREE.Vector3(player.position.x,player.position.y+2,player.position.z);
const camPos=new THREE.Vector3(player.position.x+Math.sin(angle)*7,player.position.y+4,player.position.z+Math.cos(angle)*7);
camera.position.lerp(camPos,.12);camera.lookAt(target);
if(portal)portal.rotation.z=Math.sin(now*.001)*.08;
renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
