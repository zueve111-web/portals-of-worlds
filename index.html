
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Порталы миров</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#15283b;color:white;font-family:Arial;touch-action:none}
canvas{display:block}button{border:0;border-radius:14px;padding:13px;background:#47eaff;color:#071525;font-weight:bold}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
.panel{background:#071525dd;border:1px solid #7deaff88;border-radius:12px;padding:9px;font-size:13px}
#portalBtn{pointer-events:auto;font-size:12px}
#help{position:fixed;top:72px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 2px 5px #000}
#stick{position:fixed;bottom:25px;left:20px;width:115px;height:115px;border-radius:50%;border:2px solid #c8f6ff99;background:#9deaff22;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:49px;height:49px;border-radius:50%;background:#65eaffbb}
#jump{position:fixed;bottom:40px;right:22px;width:76px;height:76px;border-radius:50%;touch-action:none}
#action{position:fixed;bottom:128px;right:28px;background:#d9b1ff}
</style>
</head>
<body>
<div id="top">
 <div class="panel"><b>🌌 ПОРТАЛЫ МИРОВ</b><br><span id="wn">Зелёная долина</span></div>
 <button id="portalBtn">ВОЙТИ В ПОРТАЛ</button>
</div>
<div id="help">Исследуй мир и найди портал</div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">ПРЫЖОК</button>
<button id="action">ДЕЙСТВИЕ</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe0f6ff,0x3d392e,2));
const sun=new THREE.DirectionalLight(0xffedc5,2.2);sun.position.set(-20,40,20);scene.add(sun);

const worlds=[
 ['Зелёная долина',0x83caff,0x438c42,0x176b42,0x16eaff],
 ['Ледяной мир',0x91ddff,0x9acbd7,0x428da9,0xbaffff],
 ['Вулканическая планета',0x35182c,0x542d32,0x9b3d23,0xff572b],
 ['Зачарованные джунгли',0x1e3a59,0x287b52,0x20c878,0xb34cff],
 ['Золотая пустыня',0xf5bd79,0xb78a4b,0x98723c,0xffd44d]
];
let world=0,portal,portalRing,portalCore,portalLight,worldObjects=[];
const player=new THREE.Group();scene.add(player);
const skin=new THREE.MeshStandardMaterial({color:0xf0b78e});
const shirt=new THREE.MeshStandardMaterial({color:0x19bde7,roughness:.5});
const pants=new THREE.MeshStandardMaterial({color:0x25345a});
function capsule(r,len,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,8),mat);
 m.position.set(x,y,z);player.add(m);return m;
}
capsule(.35,.7,shirt,0,1.05,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);head.position.y=1.72;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8,0,Math.PI*2,0,Math.PI*.5),new THREE.MeshStandardMaterial({color:0x30251e}));hair.position.y=1.82;player.add(hair);
capsule(.12,.43,shirt,-.44,1.08,0);
capsule(.12,.43,shirt,.44,1.08,0);
const leg1=capsule(.14,.42,pants,-.19,.39,0);
const leg2=capsule(.14,.42,pants,.19,.39,0);

function add(o){scene.add(o);worldObjects.push(o);return o}
function tree(x,z,s,leaf){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.17*s,.25*s,1.5*s,7),new THREE.MeshStandardMaterial({color:0x69462c}));
 trunk.position.y=.75*s;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(.9*s,2.4*s,8),new THREE.MeshStandardMaterial({color:leaf,roughness:.9}));
 crown.position.y=2.25*s;g.add(crown);g.position.set(x,0,z);add(g);
}
function clearWorld(){for(const o of worldObjects)scene.remove(o);worldObjects=[]}
function makeWorld(){
 clearWorld();
 const w=worlds[world];
 scene.background.setHex(w[1]);scene.fog=new THREE.Fog(w[1],45,135);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:w[2],roughness:1}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.12;add(ground);
 const hillMat=new THREE.MeshStandardMaterial({color:world===2?0x632e32:world===1?0xc4e6ee:world===4?0xa98248:0x526c64});
 for(let i=0;i<40;i++){
  const a=i/40*Math.PI*2,r=60+Math.random()*22,h=8+Math.random()*18;
  const hill=new THREE.Mesh(new THREE.ConeGeometry(6+Math.random()*7,h,7),hillMat);
  hill.position.set(Math.cos(a)*r,h/2-1,Math.sin(a)*r);add(hill);
 }
 for(let i=0;i<100;i++){
  const x=(Math.random()-.5)*108,z=(Math.random()-.5)*108;
  if(Math.hypot(x,z)<8||Math.hypot(x,z+27)<7)continue;
  if(Math.random()<.76)tree(x,z,.7+Math.random()*1.3,w[3]);
  else{
   const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*1.4),new THREE.MeshStandardMaterial({color:world===2?0x663b40:0x71878a}));
   rock.position.set(x,.35,z);add(rock);
  }
 }
 const path=new THREE.Mesh(new THREE.PlaneGeometry(5,32),new THREE.MeshStandardMaterial({color:world===4?0xd8b677:0x9a8b71}));
 path.rotation.x=-Math.PI/2;path.position.set(0,-.05,-16);add(path);

 portal=new THREE.Group();portal.position.set(0,2,-28);add(portal);
 const pm=new THREE.MeshStandardMaterial({color:w[4],emissive:w[4],emissiveIntensity:2.4,metalness:.3,roughness:.2});
 portalRing=new THREE.Mesh(new THREE.TorusGeometry(2,.23,16,64),pm);portal.add(portalRing);
 portalCore=new THREE.Mesh(new THREE.CircleGeometry(1.8,48),new THREE.MeshBasicMaterial({color:w[4],transparent:true,opacity:.4,side:THREE.DoubleSide}));portal.add(portalCore);
 portalLight=new THREE.PointLight(w[4],35,24);portal.add(portalLight);
 for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2;
  const orb=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  orb.position.set(Math.cos(a)*2.1,Math.sin(a)*2.1,0);portal.add(orb);
 }
 for(let i=0;i<100;i++){
  const star=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.045,6,6),new THREE.MeshBasicMaterial({color:Math.random()>.5?0xffffff:w[4]}));
  star.position.set((Math.random()-.5)*130,2+Math.random()*28,(Math.random()-.5)*130);add(star);
 }
 document.querySelector('#wn').textContent=w[0];
}
makeWorld();

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
let joyX=0,joyY=0,dragging=false;
stick.addEventListener('pointerdown',e=>{dragging=true;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(dragging)moveStick(e)});
function moveStick(e){
 const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 const d=Math.hypot(x,y),max=35;if(d>max){x=x/d*max;y=y/d*max}
 knob.style.left=31+x+'px';knob.style.top=31+y+'px';joyX=x/max;joyY=y/max;
}
function stopStick(){dragging=false;joyX=0;joyY=0;knob.style.left='31px';knob.style.top='31px'}
stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);

let vy=0,onGround=true;
function jump(){if(onGround){vy=7.5;onGround=false}}
document.querySelector('#jump').addEventListener('pointerdown',jump);
document.querySelector('#action').onclick=()=>document.querySelector('#help').textContent='Исследуй мир и ищи портал!';

document.querySelector('#portalBtn').onclick=()=>{
 if(Math.hypot(player.position.x-portal.position.x,player.position.z-portal.position.z)<5){
  world=(world+1)%worlds.length;
  makeWorld();player.position.set(0,0,0);vy=0;
  document.querySelector('#help').textContent='Новый мир открыт: '+worlds[world][0]+'!';
 }else{
  document.querySelector('#help').textContent='Подойди ближе к порталу!';
 }
};

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.035);last=now;
 let f=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-joyY;
 let s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX;
 f=THREE.MathUtils.clamp(f,-1,1);s=THREE.MathUtils.clamp(s,-1,1);
 const moving=Math.hypot(f,s)>.08;
 if(moving){
  const len=Math.hypot(f,s);f/=len;s/=len;
  // Up on the joystick always moves forward on the screen.
  player.position.z+=f*6*dt;
  player.position.x+=s*6*dt;
  player.rotation.y=Math.atan2(s,-f);
  leg1.rotation.x=Math.sin(now*.012)*.7;
  leg2.rotation.x=-Math.sin(now*.012)*.7;
 }else{leg1.rotation.x=0;leg2.rotation.x=0}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-52,52);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-55,48);
 if(keys[' '])jump();
 vy-=18*dt;player.position.y+=vy*dt;
 if(player.position.y<0){player.position.y=0;vy=0;onGround=true}
 portal.rotation.z+=dt*.45;
 portalRing.material.emissiveIntensity=2+Math.sin(now*.004)*1.2;
 const target=new THREE.Vector3(player.position.x,player.position.y+4.2,player.position.z+7.5);
 camera.position.lerp(target,.09);
 camera.lookAt(player.position.x,player.position.y+1.1,player.position.z-2);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
